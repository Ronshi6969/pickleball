<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pickleball Courts | Play Together</title>
  <link rel="icon" type="image/png" href="assets/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=4">
</head>
<body data-root="" data-nav="courts">
<!-- header, footer and messages are filled in by assets/js/common.js -->
<header class="site-header" id="site-header"></header>
<div id="flashes"></div>
<main>
<div class="container band">
  <h1>Pickleball Courts</h1>
  <form class="filters filters-loc" id="search-form" method="get" action="venues.html">
    <div class="loc-suggest-wrap">
      <label for="location">Location</label>
      <input type="text" id="location" name="location" placeholder="Select or type branch location (e.g. Silang, Imus...)" autocomplete="off">
      <div class="loc-dropdown" id="loc-dropdown" role="listbox" aria-label="Available branch locations" hidden></div>
    </div>
    <div class="actions"><button class="btn" type="submit">Search</button>
      <a class="btn btn-ghost" id="clear-link" href="venues.html" hidden>Clear</a></div>
    <div class="loc-bar" id="loc-suggestions" aria-label="Available branch locations"></div>
  </form>
  <div id="results"></div>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/common.js?v=4"></script>
<script src="assets/js/pages/venues.js?v=4"></script>
</body>
</html>
