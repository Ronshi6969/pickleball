<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Court rental | Play Together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-root="" data-nav="courts">
<!-- header, footer and messages are filled in by assets/js/common.js -->
<header class="site-header" id="site-header"></header>
<div id="flashes"></div>
<main>
<div class="container band">
  <h1>Court rental</h1>
  <form class="filters" method="get" action="venues.html">
    <div><label for="q">Court or venue name</label><input type="text" id="q" name="q" placeholder="e.g. ALAB"></div>
    <div><label for="location">Location</label><input type="text" id="location" name="location" placeholder="e.g. Imus"></div>
    <div><label for="sport">Sport</label><select id="sport" name="sport"><option value="0">All sports</option></select></div>
    <div class="actions"><button class="btn" type="submit">Search</button>
      <a class="btn btn-ghost" id="clear-link" href="venues.html" hidden>Clear</a></div>
  </form>
  <div id="results"></div>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/common.js"></script>
<script src="assets/js/pages/venues.js"></script>
</body>
</html>
