<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courts | Play Together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-root="../" data-nav="manager" data-mnav="courts">
<!-- header, footer and messages are filled in by assets/js/common.js -->
<header class="site-header" id="site-header"></header>
<div id="flashes"></div>
<main>
<nav id="manager-nav"></nav>
<div class="container band" style="padding-top:1rem">
  <h1>Courts and rates</h1>
  <form method="post" action="../actions/manager_courts.php" id="court-form" class="form-card" style="margin-bottom:2rem" novalidate>
    <h2 style="font-size:1.6rem" id="form-title">Add a court</h2>
    <input type="hidden" name="csrf" value=""><input type="hidden" name="action" value="save"><input type="hidden" name="id" value="0">
    <div class="row row-3">
      <div class="field"><label for="name">Court name</label><input type="text" id="name" name="name" required></div>
      <div class="field"><label for="sport_id">Sport</label><select id="sport_id" name="sport_id"></select></div>
      <div class="field"><label for="hourly_rate">Rate per hour (&#8369;)</label><input type="number" id="hourly_rate" name="hourly_rate" min="1" step="0.01" required></div>
    </div>
    <div class="actions"><button class="btn" type="submit" id="submit-btn">Add court</button>
      <a class="btn btn-ghost" id="cancel-link" href="courts.html" hidden>Cancel</a></div>
  </form>
  <div id="courts-box"></div>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/pages/manager_courts.js"></script>
</body>
</html>
