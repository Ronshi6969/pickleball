<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venue details | Play Together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-root="../" data-nav="manager" data-mnav="venue">
<!-- header, footer and messages are filled in by assets/js/common.js -->
<header class="site-header" id="site-header"></header>
<div id="flashes"></div>
<main>
<nav id="manager-nav"></nav>
<div class="container">
  <form method="post" action="../actions/manager_venue.php" id="venue-form" enctype="multipart/form-data" class="form-card" style="max-width:40rem;margin:1rem auto 3rem" novalidate>
    <h1 style="font-size:2.2rem">Venue details</h1>
    <input type="hidden" name="csrf" value="">
    <div class="field" id="photo-box"></div>
    <div class="field"><label for="photo">Venue photo</label><input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp"></div>
    <div class="field"><label for="name">Venue name</label><input type="text" id="name" name="name" required></div>
    <div class="row row-2">
      <div class="field"><label for="address">Address</label><input type="text" id="address" name="address" required></div>
      <div class="field"><label for="city">City</label><input type="text" id="city" name="city" required></div>
    </div>
    <div class="field"><label for="description">Description</label><textarea id="description" name="description"></textarea></div>
    <div class="row row-2">
      <div class="field"><label for="open">Opens at</label><select id="open" name="open"></select></div>
      <div class="field"><label for="close">Closes at</label><select id="close" name="close"></select></div>
    </div>
    <button class="btn btn-block" type="submit">Save venue details</button>
  </form>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/pages/manager_venue.js"></script>
</body>
</html>
