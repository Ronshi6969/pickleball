<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manager | Play Together Pickleball</title>
  <link rel="icon" type="image/png" href="../assets/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css?v=4">
</head>
<body data-root="../" data-nav="manager" data-mnav="index">
<!-- header, footer and messages are filled in by assets/js/common.js -->
<header class="site-header" id="site-header"></header>
<div id="flashes"></div>
<main>
<nav id="manager-nav"></nav>
<section class="band band-court">
  <div class="container dash-hero" id="hero"></div>
</section>
<div class="container band">
  <div class="stats" id="stats"></div>
  <div class="section-head" style="margin-top:2rem;margin-bottom:1rem">
    <h2 style="margin-bottom:0">All branches</h2>
    <a class="btn btn-sm btn-ghost" href="venue.html#add-branch">+ Add branch</a>
  </div>
  <div class="branch-grid" id="branches-box" style="margin-bottom:2.2rem"></div>
  <div class="grid">
    <a class="card" href="openplays.html" style="text-decoration:none"><div class="card-body"><h3>Manage open plays</h3><p class="muted">Create, edit and delete pickleball sessions. See who joined.</p></div></a>
    <a class="card" href="courts.html" style="text-decoration:none"><div class="card-body"><h3>Manage courts</h3><p class="muted">Add pickleball courts, set hourly rates, switch courts on or off.</p></div></a>
    <a class="card" href="blocks.html" style="text-decoration:none"><div class="card-body"><h3>Block out hours</h3><p class="muted">Close courts for maintenance or holidays.</p></div></a>
    <a class="card" href="bookings.html" style="text-decoration:none"><div class="card-body"><h3>Court rentals</h3><p class="muted">See and cancel player bookings.</p></div></a>
  </div>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/pages/manager_index.js"></script>
</body>
</html>
