<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pickleball Open plays | Play Together</title>
  <link rel="icon" type="image/png" href="../assets/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-root="../" data-nav="manager" data-mnav="openplays">
<!-- header, footer and messages are filled in by assets/js/common.js -->
<header class="site-header" id="site-header"></header>
<div id="flashes"></div>
<main>
<nav id="manager-nav"></nav>
<div class="container band" style="padding-top:1rem">
  <div class="kicker">Pickleball Sessions</div>
  <h1>Open plays</h1>
  <form method="post" action="../actions/manager_openplays.php" id="play-form" class="form-card" style="margin-bottom:2rem" novalidate>
    <h2 style="font-size:1.7rem" id="form-title">Create a pickleball open play</h2>
    <input type="hidden" name="csrf" value=""><input type="hidden" name="action" value="save"><input type="hidden" name="id" value="0">
    <div class="field"><label for="title">Title</label><input type="text" id="title" name="title" required maxlength="120"></div>
    <div class="row row-3">
      <div class="field"><label for="play_date">Date</label><input type="date" id="play_date" name="play_date" required></div>
      <div class="field"><label for="start_time">Starts</label><input type="time" id="start_time" name="start_time" required></div>
      <div class="field"><label for="end_time">Ends</label><input type="time" id="end_time" name="end_time" required></div>
    </div>
    <div class="row row-2">
      <div class="field"><label for="skill_level">Skill level</label>
        <select id="skill_level" name="skill_level">
          <option value="all">All levels</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select></div>
      <div class="field"><label for="courts_used">Courts used</label><input type="number" id="courts_used" name="courts_used" min="1" required></div>
    </div>
    <div class="row row-2">
      <div class="field"><label for="max_slots">Total slots</label><input type="number" id="max_slots" name="max_slots" min="1" required></div>
      <div class="field"><label for="price">Price per slot (&#8369;)</label><input type="number" id="price" name="price" min="0" step="0.01" required></div>
    </div>
    <div class="field"><label for="description">Description (optional)</label><textarea id="description" name="description"></textarea></div>
    <div class="actions"><button class="btn" type="submit" id="submit-btn">Create open play</button>
      <a class="btn btn-ghost" id="cancel-link" href="openplays.html" hidden>Cancel</a></div>
  </form>

  <div class="form-card" id="roster-box" style="margin-bottom:2rem" hidden>
    <h2 style="font-size:1.7rem">Registered players</h2>
    <div id="roster-list"></div>
    <a class="btn btn-sm btn-ghost" href="openplays.html">Close</a>
  </div>

  <div id="plays-box"></div>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/pages/manager_openplays.js"></script>
</body>
</html>
