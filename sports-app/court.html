<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pickleball Court | Play Together</title>
  <link rel="icon" type="image/png" href="assets/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-root="" data-nav="courts">
<!-- header, footer and messages are filled in by assets/js/common.js -->
<header class="site-header" id="site-header"></header>
<div id="flashes"></div>
<main>
<div class="container booking-layout">
  <section id="court-info"></section>

  <section class="form-card" id="booking-app">
    <div class="kicker">Hourly Court Rental</div>
    <h2 style="font-size:2rem">Pick a date and time</h2>
    <div class="field">
      <label for="book-date">Date</label>
      <input type="date" id="book-date">
    </div>
    <p id="slot-status" class="small muted" aria-live="polite"></p>
    <div id="slot-grid" class="slot-grid"></div>

    <form method="post" action="actions/book.php" id="book-form">
      <input type="hidden" name="csrf" value="">
      <input type="hidden" name="court_id" id="f-court">
      <input type="hidden" name="date" id="f-date">
      <input type="hidden" name="start_hour" id="f-start">
      <input type="hidden" name="end_hour" id="f-end">
      <div class="summary">
        <dl>
          <dt>Court</dt><dd id="sum-court">-</dd>
          <dt>Date</dt><dd id="sum-date">-</dd>
          <dt>Time</dt><dd id="sum-time">-</dd>
          <dt>Hours</dt><dd id="sum-hours">0</dd>
          <dt>Total</dt><dd id="sum-total">&#8369;0.00</dd>
        </dl>
        <div id="book-action"></div>
      </div>
    </form>
  </section>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/common.js"></script>
<script src="assets/js/pages/court.js"></script>
</body>
</html>
