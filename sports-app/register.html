<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join as a pickleball player | Play Together</title>
  <link rel="icon" type="image/png" href="assets/img/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-root="" data-nav="">
<!-- header, footer and messages are filled in by assets/js/common.js -->
<header class="site-header" id="site-header"></header>
<div id="flashes"></div>
<main>
<div class="container">
  <form method="post" action="actions/register.php" id="register-form" class="form-card form-narrow" novalidate>
    <div class="kicker">Pickleball Player Account</div>
    <h1 style="font-size:2.6rem">Join the club</h1>
    <input type="hidden" name="csrf" value="">
    <div class="field"><label for="name">Full name</label>
      <input type="text" id="name" name="name" required maxlength="100"></div>
    <div class="field"><label for="email">Email</label>
      <input type="email" id="email" name="email" required></div>
    <div class="row row-2">
      <div class="field"><label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password"></div>
      <div class="field"><label for="password2">Confirm password</label>
        <input type="password" id="password2" name="password2" required minlength="8" autocomplete="new-password"></div>
    </div>
    <div class="field"><label for="skill">Pickleball skill level</label>
      <select id="skill" name="skill">
        <option value="beginner">Beginner</option>
        <option value="intermediate">Intermediate</option>
        <option value="advanced">Advanced</option>
      </select></div>
    <button class="btn btn-block" type="submit">Create player account <span class="btn-arrow">&rarr;</span></button>
    <p class="small center muted" style="margin-top:1rem">Already have an account? <a href="login.html" class="text-volt">Log in</a></p>
  </form>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/common.js"></script>
<script src="assets/js/pages/register.js"></script>
</body>
</html>
